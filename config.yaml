# config.yaml — v3.0
# active_provider: використовується тільки якщо не вибрано preset
active_provider: gemini

providers:
  openai:
    api_key: ""  # або через .env → OPENAI_API_KEY
    model: "gpt-4o-mini"
    generation_params:
      temperature: 0.7
      max_tokens: 16000
  gemini:
    api_key: ""  # або через .env → GEMINI_API_KEY
    model: "gemini-2.5-flash"
    generation_params:
      temperature: 0.7
      max_tokens: 16000

# 3 пресети для body-генерації + завжди дешевий helper для planner/blueprint/translate/intro/conclusion
default_preset: standard
presets:
  economy:
    main: {provider: openai, model: gpt-4o-mini}
    helper: {provider: openai, model: gpt-4o-mini}
  standard:
    main: {provider: gemini, model: gemini-2.5-flash}
    helper: {provider: openai, model: gpt-4o-mini}
  quality:
    main: {provider: openai, model: gpt-4o}
    helper: {provider: openai, model: gpt-4o-mini}

research:
  openalex_email: null       # задайте свій email для polite pool (швидше/стабільніше)
  openalex_max_results: 8
  # Tavily вмикається автоматично, якщо у .env є TAVILY_API_KEY

project_settings:
  work_type: coursework       # coursework | report | essay | diploma
  input_toc_file: "input/toc.txt"
  output_dir: "output/"
  concurrency: 5              # скільки секцій генерувати паралельно
  sources_per_section: 8      # скільки джерел передавати в промпт кожної секції
  topic: "Аналіз теоретичного існування розладів: плутання заборів з машинами та плутання машин з заборами"
  methodology_summary: |
    - Дотримуватись академічного стилю.
    - Обсяг роботи: 10-20 сторінок.
    - Обов'язково посилання на джерела.
    - Структура: Вступ, 2-3 Розділи, Висновки, Список літератури.
